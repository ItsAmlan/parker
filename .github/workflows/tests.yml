name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # Real nginx lets the suite run every generated config through `nginx -t`.
      - name: Install nginx
        run: sudo apt-get update && sudo apt-get install -y nginx && sudo systemctl stop nginx
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
